name: Watch the market

on:
  schedule:
    # 23 past the hour - quieter than :00 or :05, so fewer runs get skipped
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Test the theories
        run: python learn.py

      - name: Write today's note if it is missing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COINS: bitcoin,ethereum,solana,ripple,cardano,dogecoin,binancecoin,chainlink
        run: python ensure_note.py

      - name: Check the market
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COINS: bitcoin,ethereum,solana,ripple,cardano,dogecoin,binancecoin,chainlink
          MIN_MOVE_PCT: "1.5"
          SENSITIVITY: "2.5"
        run: python watch.py

      - name: Count what it has done
        run: python stats.py

      - name: Save what it learned
        run: |
          git config user.name "crypto-agent"
          git config user.email "agent@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/ docs/
          git diff --staged --quiet || git commit -m "watch $(date -u +%Y-%m-%dT%H:%M)"
          git push
