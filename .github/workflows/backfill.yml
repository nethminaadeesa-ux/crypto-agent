name: Backfill from past data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Mine the past year
        env:
          COINS: bitcoin,ethereum,solana,ripple,cardano,dogecoin,binancecoin,chainlink
          BACKFILL_DAYS: "365"
          SENSITIVITY: "2.5"
        run: python backfill.py

      - name: Save the library
        run: |
          git config user.name "crypto-agent"
          git config user.email "agent@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/ docs/
          git diff --staged --quiet || git commit -m "backfill from past price history"
          git push
