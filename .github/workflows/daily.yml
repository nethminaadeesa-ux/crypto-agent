name: Daily crypto note

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Write the morning note
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COINS: bitcoin,ethereum,solana,ripple,cardano,dogecoin,binancecoin,chainlink
          HORIZON_DAYS: "7"
        run: python agent.py

      - name: Predict, compare, correct
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COINS: bitcoin,ethereum,solana
          HORIZON_DAYS: "7"
        run: python predict.py

      - name: Save what it learned
        run: |
          git config user.name "crypto-agent"
          git config user.email "agent@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/ docs/
          git diff --staged --quiet || git commit -m "note for $(date +%Y-%m-%d)"
          git push
